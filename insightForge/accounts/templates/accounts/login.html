<!DOCTYPE html>
<html>
<head>
    <title>InsightForge – Login</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        form { margin: 20px 0; }
        input { display: block; margin: 10px 0; padding: 10px; width: 300px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
        .register-link { margin-top: 20px; }
        .register-link a { color: #007bff; }
    </style>
</head>
<body>

<h1>Login</h1>

<form method="post">
    {% csrf_token %}
    <input name="email" placeholder="Email" type="email" required>
    <input name="password" type="password" placeholder="Password" required>
    <button type="submit">Login</button>
</form>

<p class="register-link">Don't have an account? <a href="/accounts/register/">Register here</a></p>

</body>
</html>
