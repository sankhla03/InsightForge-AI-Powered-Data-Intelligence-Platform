<!DOCTYPE html>
<html>
<head>
    <title>InsightForge – Register</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        form { margin: 20px 0; }
        input { display: block; margin: 10px 0; padding: 10px; width: 300px; }
        button { padding: 10px 20px; background: #28a745; color: white; border: none; cursor: pointer; }
        button:hover { background: #218838; }
        .login-link { margin-top: 20px; }
        .login-link a { color: #007bff; }
    </style>
</head>
<body>

<h1>Register</h1>

<form method="post">
    {% csrf_token %}
    <input name="username" placeholder="Username" required>
    <input name="email" placeholder="Email" type="email" required>
    <input name="password" type="password" placeholder="Password" required>
    <button type="submit">Register</button>
</form>

<p class="login-link">Already have an account? <a href="/accounts/login/">Login here</a></p>

</body>
</html>
